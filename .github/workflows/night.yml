name: night

on:
  schedule:
    - cron: "30 14 * * 1-5"   # 台灣時間 週一到週五 22:30（GitHub 用 UTC，所以是 14:30）
  workflow_dispatch:          # 也可以手動執行：Actions → night → Run workflow
    inputs:
      diag:
        description: "診斷模式：不管大盤層級，列出所有策略符合的股票與各條件通過檔數"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安裝中文字型（畫圖用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: Run
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DIAG: ${{ inputs.diag }}
        run: python night.py
