# Render 一鍵部署設定：Render → New → Blueprint → 選這個 repo，就會照這裡建立機器人主機
services:
  - type: web
    name: stockhunter-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install requests pandas numpy yfinance lxml
    startCommand: python bot_server.py
    healthCheckPath: /
    autoDeploy: true
    buildFilter:                 # 只有這些檔案改了才重新部署（夜間掃描每天存結果時不會一直重啟）
      paths:
        - intraday.py
        - bot_server.py
        - config.py
        - strategies.py
        - notify.py
        - lookup.py
        - data.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: TG_OWNER_ID
        sync: false
