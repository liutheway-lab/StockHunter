name: intraday

on:
  schedule:
    - cron: "50 0 * * 1-5"   # 台灣時間 週一到週五 08:50 啟動，一路監控到 13:30
  workflow_dispatch:          # 也可以手動執行：Actions → intraday → Run workflow

concurrency:
  group: tg-bot              # 跟 commands 輪流，不會同時讀 Telegram 訊息
  cancel-in-progress: false

permissions:
  contents: write            # 13:00 恐慌承接預判名單要存回 repo，晚上夜間掃描才能對照

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 盤中監控
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}   # 富果行情金鑰（證交所連不上時用）
        run: python intraday.py
      - name: 存 13:00 預判名單
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add absorb_1300.json || true
          git diff --cached --quiet || git commit -m "13:00 恐慌承接預判名單"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 0
