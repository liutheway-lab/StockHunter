name: turnover_probe

on:
  workflow_dispatch:          # 只有手動執行：Actions → turnover_probe → Run workflow（盤中執行）

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 估算全市場成交金額
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
        run: python turnover_probe.py
