name: taifex_probe

on:
  workflow_dispatch:          # 只有手動執行：Actions → taifex_probe → Run workflow（一次性探測，用完可刪）

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests pandas
      - name: 期交所逐筆資料探測
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
        run: python taifex_probe.py
